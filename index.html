<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- Reflektion 1.2: Om man önskar lägga script inom <head> kan man använda attributet defer för att
        vara säker på att sidan ändå kommer läsas in först, innan scriptet körs -->
  </head>
  <body>
    <!-- Reflektion 1.1: Genom att lägga <script> längst ner i "body" ser man till att sidan
        läses in innan scriptet exekveras. -->
    <script src="script.js"></script>
  </body>
</html>
